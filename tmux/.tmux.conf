# Set the default terminal terminfo
set -g default-terminal "screen-256color"

# Use RGB color
set -as terminal-features ",gnome*:RGB"

# Enable mouse mode (drag to select, scroll, click to switch panes)
set -g mouse on

# When you drag-select text in copy-mode, immediately copy to system clipboard
# and stay in copy-mode (so you don't need to press Enter/y)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Let tmux pass copies through OSC 52 to the terminal too (handy over SSH,
# and Ghostty supports this natively)
set -s set-clipboard on

# Number windows and panes from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
