# Personal Ghostty overrides layered on top of Omarchy 4's stock config.

font-size = 15

keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard

# Hyprland maps the physical Command-position key (Alt) to these Ctrl chords.
# Ctrl+C remains unbound so it continues to interrupt terminal processes.
keybind = control+v=paste_from_clipboard
keybind = control+a=select_all
keybind = control+f=start_search
keybind = control+w=close_tab:this
keybind = control+t=new_tab
keybind = control+n=new_window

# Hyprland translates physical Option+Backspace to Ctrl+Backspace. Send the
# shell's Ctrl+W word-delete byte directly without triggering close_tab above.
keybind = control+backspace=text:\x17
