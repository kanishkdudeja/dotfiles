# Semantic workspaces inspired by the AeroSpace setup.
# DELL is the primary/right monitor; LG is the secondary/left monitor.

# DELL: freeform, browser, code, notes, personal, and Slack.
workspace = 1, monitor:desc:Dell Inc. AW2725QF 51GD934, default:true, persistent:true
workspace = 2, monitor:desc:Dell Inc. AW2725QF 51GD934, persistent:true
workspace = name:B, monitor:desc:Dell Inc. AW2725QF 51GD934, persistent:true
workspace = name:C, monitor:desc:Dell Inc. AW2725QF 51GD934, persistent:true
workspace = name:N, monitor:desc:Dell Inc. AW2725QF 51GD934, persistent:true
workspace = name:P, monitor:desc:Dell Inc. AW2725QF 51GD934, persistent:true
workspace = name:S, monitor:desc:Dell Inc. AW2725QF 51GD934, persistent:true

# LG: music, terminal, and WhatsApp.
workspace = name:M, monitor:desc:LG Electronics LG ULTRAGEAR 308NTLE7U344, persistent:true
workspace = name:T, monitor:desc:LG Electronics LG ULTRAGEAR 308NTLE7U344, default:true, persistent:true
workspace = name:W, monitor:desc:LG Electronics LG ULTRAGEAR 308NTLE7U344, persistent:true

# Route newly opened application windows without changing the focused workspace.
windowrule = workspace name:B silent, match:class (google-chrome|Google-chrome)
windowrule = workspace name:C silent, match:class (Cursor|cursor)
windowrule = workspace name:M silent, match:class (Spotify|spotify)
windowrule = workspace name:N silent, match:class (Obsidian|obsidian)
windowrule = workspace name:S silent, match:class (Slack|slack)
windowrule = workspace name:T silent, match:class com.mitchellh.ghostty
windowrule = workspace name:W silent, match:class (WhatsApp|chrome-web.whatsapp.com__.*)
