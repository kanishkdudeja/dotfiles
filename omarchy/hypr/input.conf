# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk
  #kb_options = compose:caps # ,grp:alts_toggle
  #kb_options = ctrl:nocaps
  # Caps drives Omarchy's Super shortcuts; Windows keys are a private Option-style layer.
  kb_options = caps:super,altwin:hyper_win

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Increase sensitity for mouse/trackpack (default: 0)
  sensitivity = 0

  accel_profile = flat
  
  # accel_profile = custom 0.05 0.0 0.05 0.08 0.11 0.14 0.17 0.20 0.23 0.25
  # accel_profile = custom 0.05 0.0 0.01 0.02 0.04 0.08 0.13 0.18 0.22 0.25 0.27
  # accel_profile = custom 0.05 0.0 0.02 0.04 0.07 0.10 0.13 0.16 0.19 0.21 0.23
  # accel_profile = custom 0.05 0.0 0.01 0.03 0.06 0.10 0.13 0.16 0.19 0.21 0.23
  # accel_profile = custom 0.05 0.0 0.005 0.015 0.04 0.08 0.12 0.16 0.19 0.21 0.23
  # accel_profile = custom 0.05 0.0 0.003 0.012 0.035 0.07 0.12 0.16 0.19 0.21 0.23

  # Disabled since it seems to increase sensitivity
  # force_no_accel = true

  touchpad {
    # Use natural (inverse) scrolling
    # natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

# Scroll faster in the terminal
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
Thewindowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2

