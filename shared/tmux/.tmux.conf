# Set the default terminal terminfo
set -g default-terminal "tmux-256color"

# Use RGB / truecolor. "*:RGB" enables it for every outer terminal
# (Ghostty, gnome-terminal, etc.) so themes render with full color.
set -as terminal-features ",*:RGB"

# Enable mouse mode (drag to select, scroll, click to switch panes)
set -g mouse on

# When you drag-select text in copy-mode, immediately copy to system clipboard
# and stay in copy-mode (so you don't need to press Enter/y)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Let tmux pass copies through OSC 52 to the terminal too (handy over SSH,
# and Ghostty supports this natively)
set -s set-clipboard on

# Number windows and panes from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Don't let programs (e.g. the shell's title escape = user@hostname) rename
# windows out from under you. Keeps manually-named windows stable across
# config reloads. `automatic-rename` still works for un-named windows.
set -g allow-rename off

# Use Ctrl-Space as the prefix instead of the default Ctrl-b.
# Double-tap (Ctrl-Space Space) to send a literal Ctrl-Space to the app.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Plugins (managed by TPM — prefix + I to install, prefix + U to update)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ── Theme ──────────────────────────────────────────────────────────
# All themes are pre-cloned under ~/.tmux/plugins (see shared/tmux/install.sh).
# Exactly ONE block should be active. To switch: comment the active block,
# uncomment another, then reload with `tmux source-file ~/.tmux.conf`.
# (Loaded by direct path rather than @plugin because catppuccin/tmux and
# dracula/tmux share the folder name "tmux" and would collide under TPM.)

